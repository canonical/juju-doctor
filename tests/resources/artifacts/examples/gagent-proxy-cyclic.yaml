model:
  name: example
  type: caas
  controller: example
  cloud: kubernetes
  version: 4.0.0
machines: {}
applications:
  ga:
    charm: grafana-agent
    charm-origin: charmhub
    charm-name: grafana-agent
    charm-rev: 1
    exposed: false
    relations:
      cos-agent:
      - related-application: cp
        interface: cos_agent
      send-remote-write:
      - related-application: prom
        interface: prometheus_remote_write
  cp:
    charm: cos-proxy
    charm-origin: charmhub
    charm-name: cos-proxy
    charm-rev: 1
    exposed: false
    relations:
      cos-agent:
      - related-application: ga
        interface: cos_agent
      downstream-prometheus-scrape:
      - related-application: prom
        interface: prometheus_scrape
  prom:
    charm: prometheus-k8s
    charm-origin: charmhub
    charm-name: prometheus-k8s
    charm-rev: 1
    exposed: false
    relations:
      receive-remote-write:
      - related-application: ga
        interface: prometheus_remote_write
      metrics-endpoint:
      - related-application: cp
        interface: prometheus_scrape
